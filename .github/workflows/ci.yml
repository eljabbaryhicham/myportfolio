name: CI

on:
  push:
    branches: [main, master, myportfolio]
  pull_request:

jobs:
  quality:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Non-blocking: the repo has pre-existing `react-hooks/refs` errors in
        # HomePage.tsx that predate this workflow. Keep them visible here so
        # they can be fixed incrementally, but don't fail the pipeline on them.
        continue-on-error: true
        run: npm run lint

      - name: Test
        run: npm test
